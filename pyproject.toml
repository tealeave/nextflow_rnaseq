[project]
name = "nextflow-rnaseq"
version = "0.1.0"
description = "RNA-seq pipeline managed by nextflow"
authors = [
    {name = "David Lin"}
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas (>=2.3.0,<3.0.0)",
    "matplotlib (>=3.10.3,<4.0.0)",
    "seaborn (>=0.13.2,<0.14.0)",
    "multiqc (>=1.29,<2.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
